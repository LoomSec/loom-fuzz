[package]
name = "loom-fuzz-pocgen"
description = "L2 exploit layer: synthesize value-impact Foundry PoC projects from confirmed witnesses"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
alloy-primitives = { version = "1.6.1", features = ["serde"] }
loom-fuzz-oracle = { version = "0.1.0", path = "../oracle" }
serde_json = "1"

[dev-dependencies]
loom-fuzz-cli = { version = "0.1.0", path = "../cli" }
loom-fuzz-fuzz = { version = "0.1.0", path = "../fuzz" }
loom-fuzz-seed = { version = "0.1.0", path = "../seed" }
loom-fuzz-shard = { version = "0.1.0", path = "../shard" }
loom-fuzz-xlayer = { version = "0.1.0", path = "../xlayer" }
