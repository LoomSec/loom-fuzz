[package]
name = "loom-fuzz-fuzz"
description = "Directed single-contract executor: revm sessions guided by CFG PC distance, with witness recording"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
llm = []

[dependencies]
alloy-eips = "2"
alloy-primitives = { version = "1.6.1", features = ["serde"] }
alloy-provider = "2"
alloy-rpc-client = "2"
alloy-transport-http = { version = "2", features = ["reqwest"] }
loom-fuzz-seed = { version = "0.1.0", path = "../seed" }
revm = { version = "42.0.1", default-features = false, features = ["std", "secp256k1", "optional_balance_check", "alloydb"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
loom-fuzz-cli = { version = "0.1.0", path = "../cli" }
loom-fuzz-shard = { version = "0.1.0", path = "../shard" }
loom-fuzz-xlayer = { version = "0.1.0", path = "../xlayer" }
sha3 = "0.11"
serde_json = "1"
