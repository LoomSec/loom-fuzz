[package]
name = "loom-fuzz-fuzz"
description = "Directed single-contract executor: revm sessions guided by CFG PC distance, with witness recording"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
alloy-primitives = { version = "1.6.1", features = ["serde"] }
loom-fuzz-seed = { version = "0.1.0", path = "../seed" }
revm = { version = "42.0.1", default-features = false, features = ["std", "secp256k1", "optional_balance_check"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
loom-fuzz-cli = { version = "0.1.0", path = "../cli" }
loom-fuzz-shard = { version = "0.1.0", path = "../shard" }
loom-fuzz-xlayer = { version = "0.1.0", path = "../xlayer" }
sha3 = "0.11"
serde_json = "1"
