[package]
name = "loom-fuzz-oracle"
description = "Family oracle + three-valued verdict + poc.json / fuzz_report.json artifacts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
alloy-primitives = { version = "1.6.1", features = ["serde"] }
loom-fuzz-fuzz = { version = "0.1.0", path = "../fuzz" }
loom-fuzz-seed = { version = "0.1.0", path = "../seed" }
loom-fuzz-shard = { version = "0.1.0", path = "../shard" }
loom-fuzz-xlayer = { version = "0.1.0", path = "../xlayer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.11"

[dev-dependencies]
loom-fuzz-cli = { version = "0.1.0", path = "../cli" }
loom-fuzz-shard = { version = "0.1.0", path = "../shard" }
loom-fuzz-xlayer = { version = "0.1.0", path = "../xlayer" }
