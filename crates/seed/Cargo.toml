[package]
name = "loom-fuzz-seed"
description = "Seed compiler: dominating guard algebra back-solved into precise fuzz seed Inputs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
alloy-primitives = { version = "1.6.1", features = ["serde"] }
loom-fuzz-shard = { version = "0.1.0", path = "../shard" }
loom-fuzz-xlayer = { version = "0.1.0", path = "../xlayer" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
loom-fuzz-oracle = { version = "0.1.0", path = "../oracle" }
loom-fuzz-cli = { version = "0.1.0", path = "../cli" }
